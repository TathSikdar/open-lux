name: Release

# Push a tag to cut a release:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # or build the artifacts by hand, without tagging

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-installer
            path: dist/*.exe
          # Oldest supported glibc wins the most machines.
          - os: ubuntu-22.04
            artifact: linux-appimage
            path: dist/*.AppImage

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Unlike CI, the release build *does* want the DDC binding compiled in.
      # windows-latest ships the MSVC toolchain; the Linux build shells out to
      # ddcutil at runtime and has nothing to compile.
      - run: npm ci

      # electron-builder takes the version from package.json, so a tag that
      # disagrees with it would ship a mislabelled installer.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "package.json is $pkg but the tag is $tag" >&2
            exit 1
          fi

      - run: npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.exe
            *.AppImage
          # The generated PR list is appended below this.
          body: |
            **Windows** — run the `-windows-x64-setup.exe` installer. Per-user,
            no administrator prompt.

            **Linux** — `chmod +x` the `-linux-x86_64.AppImage` and run it.
            Needs `ddcutil` and access to `/dev/i2c-*`.
          generate_release_notes: true
