name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22", "24"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The tests reach only core.js, controller.js and hardware.js, none of
      # which pull in electron or a native module -- so the optional DDC binding
      # failing to build on a runner must not fail the job. No display server
      # either: that is the point of keeping the sweep and the control loop out
      # of the window.
      - run: npm ci --omit=optional

      - run: npm test
