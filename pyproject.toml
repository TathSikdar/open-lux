[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-lux"
version = "1.0.0"
description = "Ambient-light driven brightness for DDC/CI monitors, with a measured per-display calibration"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Tath Sikdar", email = "rikisikdar1@gmail.com" }]
keywords = ["brightness", "ambient-light", "ddc", "ddc-ci", "arduino", "monitor", "ldr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "PySide6>=6.5",
    "pyserial>=3.5",
    "monitorcontrol>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/TathSikdar/open-lux"
Source = "https://github.com/TathSikdar/open-lux"
Issues = "https://github.com/TathSikdar/open-lux/issues"

# A tray app should not drag a console window along on Windows.
[project.gui-scripts]
openlux = "openlux.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["openlux"]

[tool.hatch.build.targets.sdist]
include = ["openlux", "tests", "firmware", "docs", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
